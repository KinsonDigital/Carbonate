name: ✅Testing Status Check
run-name: ✅Unit Testing Status Check (${{ github.base_ref }} branch)


defaults:
  run:
    shell: pwsh


on:
  pull_request:
    branches: [main, preview]


jobs:
  main_tests:
    name: Run ${{ vars.PROJECT_NAME }} Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up .NET SDK (${{ vars.NET_SDK_VERSION }})
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.NET_SDK_VERSION }}

      - name: Restore ${{ vars.PROJECT_NAME }}Tests Dependencies
        run: dotnet restore "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}Tests/${{ vars.PROJECT_NAME }}Tests.csproj"

      - name: Execute ${{ vars.PROJECT_NAME }} Tests
        run: dotnet test "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}Tests/${{ vars.PROJECT_NAME }}Tests.csproj" -c Debug --no-restore


  integration_tests:
    name: Run ${{ vars.PROJECT_NAME }} Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up .NET SDK (${{ vars.NET_SDK_VERSION }})
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.NET_SDK_VERSION }}

      - name: Restore ${{ vars.PROJECT_NAME }}IntegrationTests Dependencies
        run: dotnet restore "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}IntegrationTests/${{ vars.PROJECT_NAME }}IntegrationTests.csproj"

      - name: Execute ${{ vars.PROJECT_NAME }} Integration Tests
        run: dotnet test "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}IntegrationTests/${{ vars.PROJECT_NAME }}IntegrationTests.csproj" -c Debug --no-restore


  test_status_check:
    name: ${{ vars.PROJECT_NAME }} Test Status Check
    needs: [main_tests, integration_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Print Status Check Pass Message
        shell: pwsh
        run: Write-Host "::notice::✅Test Status Check Passed✅";
