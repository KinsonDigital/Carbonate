name: ✅ Testing Status Check
run-name: ✅ Unit Testing Status Check (${{ github.base_ref }} branch)


defaults:
  run:
    shell: pwsh


on:
  pull_request:
    branches: [main, preview]


jobs:
  main_tests:
    name: Run ${{ vars.PROJECT_NAME }} Tests
    strategy:
      fail-fast: false
      matrix:
        platform: ["windows-latest", "ubuntu-latest", "macos-latest"]
        build_config: ["Debug", "Release"]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up .NET SDK (${{ vars.NET_SDK_VERSION }})
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 #v5.4.0
        with:
          dotnet-version: ${{ vars.NET_SDK_VERSION }}

      - name: Run Build
        run: dotnet build "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}Tests/${{ vars.PROJECT_NAME }}Tests.csproj" -c Debug;


  integration_tests:
    name: Run ${{ vars.PROJECT_NAME }} Integration Tests
    strategy:
      fail-fast: false
      matrix:
        platform: ["windows-latest", "ubuntu-latest", "macos-latest"]
        build_config: ["Debug", "Release"]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Up .NET SDK (${{ vars.NET_SDK_VERSION }})
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 #v5.4.0
        with:
          dotnet-version: ${{ vars.NET_SDK_VERSION }}

      - name: Run Build
        run: dotnet build "${{ github.workspace }}/Testing/${{ vars.PROJECT_NAME }}IntegrationTests/${{ vars.PROJECT_NAME }}IntegrationTests.csproj" -c Debug;

  test_status_check:
    name: ${{ vars.PROJECT_NAME }} Test Status Check
    needs: [main_tests, integration_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Print Status Check Pass Message
        shell: pwsh
        run: Write-Host "::notice::✅Test Status Check Passed✅";
