name: 🚀Release
run-name: ${{ vars.PROJECT_NAME }} ${{ inputs.release-type }} Release ${{ inputs.dry-run == true && '(Dry Run)' || '' }}


defaults:
  run:
    shell: pwsh


on:
  workflow_dispatch:
    inputs:
      release-type:
        description: The type of release.  Choose 'Preview' or 'Production'.
        required: true
        type: choice
        options: [Preview, Production]
      dry-run:
        description: Dry Run - Check to run the workflow without creating a release.
        required: false
        default: false
        type: boolean


permissions:
  contents: write


jobs:
  determine_release_notes_path:
    name: Determine Release Notes File Path
    runs-on: ubuntu-latest
    outputs:
      release-notes-file-path: ${{ steps.get-notes-path.outputs.release-notes-file-path }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Release Notes File Path
        id: get-notes-path
        run: |
          $dirPath = "${{ inputs.release-type }}" -eq "Production" ? "${{ vars.PROD_RELATIVE_RELEASE_NOTES_DIR_PATH }}" : "${{ vars.PREV_RELATIVE_RELEASE_NOTES_DIR_PATH }}";

          [xml]$csproj = Get-Content "${{ github.workspace }}/${{ vars.PROJECT_NAME }}/${{ vars.PROJECT_NAME }}.csproj";
          $version = $csproj.Project.PropertyGroup.Version.Trim();

          $filePath = "${{ github.workspace }}/$dirPath/${{ vars.RELEASE_NOTES_FILE_NAME_PREFIX }}v$version.md";
          "release-notes-file-path=$filePath" >> $env:GITHUB_OUTPUT;


  run_release:
    name: Performing ${{ inputs.release-type }} Release of ${{ vars.PROJECT_NAME }} (${{ inputs.release-type == 'Production' && 'Release' || 'Debug' }})
    needs: determine_release_notes_path
    uses: KinsonDigital/Infrastructure/.github/workflows/dotnet-lib-release.yml@v17.1.0
    with:
      project-name: "${{ vars.PROJECT_NAME }}"
      release-type: "${{ inputs.release-type }}"
      net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
      release-notes-file-path: "${{ needs.determine_release_notes_path.outputs.release-notes-file-path }}"
      build-config: ${{ inputs.release-type == 'Production' && 'Release' || 'Debug' }}
      deno-version: "${{ vars.DENO_VERSION }}"
      dry-run: ${{ inputs.dry-run }}
      transpile-readme: true
    secrets:
      cicd-pat: "${{ secrets.CICD_TOKEN }}"
      nuget-org-api-key: "${{ secrets.NUGET_ORG_API_KEY }}"
