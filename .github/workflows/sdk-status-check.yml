name: ✅ SDK Status Check
run-name: ✅ SDK Status Check (${{ github.base_ref }} branch)


defaults:
  run:
    shell: pwsh


on:
  pull_request:
    branches: [main, preview]


jobs:
  sdk_status_check:
    name: ${{ vars.PROJECT_NAME }} SDK Status Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate SDK Versions
        uses: KinsonDigital/Infrastructure/actions/validate-sdk-versions@acc7aa3997697717943e56c439f7b529d1e1d1ba # v19.0.0
        with:
          base-search-dir-path: "${{ github.workspace }}"
          net-sdk-version: "${{ vars.NET_SDK_VERSION }}"
